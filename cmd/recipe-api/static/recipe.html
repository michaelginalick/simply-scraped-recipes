<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <a href="/" class="back-link">← Recipes</a>
    <article id="detail"></article>
  </main>
  <script>
    const detail = document.getElementById('detail');
    const id = window.location.pathname.split('/').pop();

    function copyToClipboard(text) {
      if (navigator.clipboard) {
        return navigator.clipboard.writeText(text);
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        return Promise.resolve();
      } catch (e) {
        return Promise.reject(e);
      } finally {
        document.body.removeChild(ta);
      }
    }

    function el(tag, ...children) {
      const node = document.createElement(tag);
      for (const child of children) {
        node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
      }
      return node;
    }

    function render(recipe) {
      document.title = recipe.name;

      const header = document.createElement('div');
      header.className = 'recipe-header';
      header.appendChild(el('h2', recipe.name));

      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = 'Copy link';
      copyBtn.addEventListener('click', () => {
        copyToClipboard(window.location.href).then(() => {
          copyBtn.textContent = 'Copied!';
          copyBtn.classList.add('copied');
          setTimeout(() => {
            copyBtn.textContent = 'Copy link';
            copyBtn.classList.remove('copied');
          }, 2000);
        });
      });
      header.appendChild(copyBtn);
      detail.appendChild(header);

      detail.appendChild(el('h3', 'Ingredients'));
      const ul = document.createElement('ul');
      for (const ing of recipe.ingredients ?? []) {
        ul.appendChild(el('li', ing.name));
      }
      detail.appendChild(ul);

      detail.appendChild(el('h3', 'Instructions'));
      const ol = document.createElement('ol');
      for (const inst of recipe.instructions ?? []) {
        ol.appendChild(el('li', inst.step));
      }
      detail.appendChild(ol);
    }

    async function load() {
      if (!id || !/^\d+$/.test(id)) {
        detail.textContent = 'Invalid recipe ID.';
        return;
      }

      try {
        const res = await fetch(`/recipe/${id}`);
        if (res.status === 404) {
          detail.textContent = 'Recipe not found.';
          return;
        }
        if (!res.ok) {
          detail.textContent = 'Failed to load recipe.';
          return;
        }
        const { data } = await res.json();
        render(data);
      } catch (e) {
        console.error('load recipe failed', e);
        detail.textContent = 'Failed to load recipe.';
      }
    }

    load();
  </script>
</body>
</html>
